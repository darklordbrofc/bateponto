<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#050505">
    <link rel="manifest" href="manifest.json">
    <title>Ponto Elite Pro V15</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.25/jspdf.plugin.autotable.min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Poppins:wght@300;400;600&display=swap');
        :root { --gold: #D4AF37; --gold-grad: linear-gradient(135deg, #f9e498 0%, #D4AF37 50%, #b8860b 100%); --bg: #050505; --card: #111111; }
        body { font-family: 'Poppins', sans-serif; background-color: var(--bg); color: #fff; margin: 0; display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding-bottom: 50px; }
        .status-bar { width: 100%; padding: 12px 0; display: flex; justify-content: center; align-items: center; gap: 10px; background: #000; border-bottom: 1px solid #222; font-size: 11px; font-weight: 600; text-transform: uppercase; }
        .dot { width: 10px; height: 10px; border-radius: 50%; box-shadow: 0 0 10px currentColor; }
        .header h1 { font-family: 'Orbitron', sans-serif; background: var(--gold-grad); -webkit-background-clip: text; -webkit-text-fill-color: transparent; font-size: 22px; margin: 20px 0; }
        .clock-box { text-align: center; margin-bottom: 20px; padding: 10px 30px; background: rgba(212, 175, 55, 0.05); border-radius: 50px; border: 1px solid rgba(212, 175, 55, 0.2); }
        #clock { font-family: 'Orbitron', sans-serif; font-size: 32px; color: var(--gold); }
        .main-container { width: 92%; max-width: 400px; background: var(--card); padding: 25px; border-radius: 28px; border: 1px solid #222; box-shadow: 0 25px 50px rgba(0,0,0,0.8); }
        .btn { width: 100%; padding: 18px; margin: 10px 0; border: none; border-radius: 16px; font-weight: 700; text-transform: uppercase; cursor: pointer; transition: 0.3s; font-size: 12px; display: flex; align-items: center; justify-content: center; color: #fff; }
        .btn-gold { background: var(--gold-grad); color: #000; }
        .btn-outline { background: transparent; border: 1px solid #333; color: #aaa; }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.98); z-index: 1000; overflow-y: auto; padding-top: 20px; }
        .modal-content { background: #0f0f0f; width: 90%; max-width: 400px; margin: auto; padding: 25px; border-radius: 24px; border: 1px solid #333; }
        label { color: var(--gold); font-size: 10px; font-weight: 700; display: block; margin-top: 15px; }
        input { width: 100%; padding: 14px; margin-top: 5px; background: #1a1a1a; border: 1px solid #333; border-radius: 10px; color: #fff; box-sizing: border-box; }
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .day-item { font-size: 10px; padding: 10px; background: #1a1a1a; border: 1px solid #333; border-radius: 8px; text-align: center; cursor: pointer; color: #666; }
        .day-item.active { background: var(--gold-grad); color: #000; font-weight: bold; }
    </style>
</head>
<body>

    <div class="status-bar">
        <div class="dot" id="status-dot"></div>
        <span id="status-text">CARREGANDO...</span>
    </div>

    <div class="header"><h1>PONTO ELITE PRO</h1></div>

    <div class="clock-box"><div id="clock">00:00:00</div></div>

    <div class="main-container">
        <button class="btn btn-gold" id="btn-ponto" onclick="registrarPonto()">Bater Ponto</button>
        <button class="btn btn-outline" style="color:#5af" onclick="abrirModal('modal-retro')">✎ Lançamento Retroativo</button>
        <button class="btn btn-outline" onclick="abrirModal('modal-vale')">💰 Registrar Vale</button>
        <div class="grid-2">
            <button class="btn btn-outline" onclick="gerarPDF()">📄 Relatório</button>
            <button class="btn btn-outline" onclick="abrirModal('modal-config')">⚙ Ajustes</button>
        </div>
        <button class="btn btn-outline" style="color: #ff3b30; border-color: #400; margin-top: 20px;" onclick="limparDados()">🗑 Limpar Histórico</button>
    </div>

    <!-- MODAL AJUSTES -->
    <div id="modal-config" class="modal">
        <div class="modal-content">
            <h2 style="color: var(--gold); margin: 0;">Ajustes Contratuais</h2>
            <label>Dias de Trabalho</label>
            <div class="grid-2" style="grid-template-columns: repeat(4, 1fr); margin-bottom: 10px;">
                <div class="day-item" data-day="1">SEG</div><div class="day-item" data-day="2">TER</div>
                <div class="day-item" data-day="3">QUA</div><div class="day-item" data-day="4">QUI</div>
                <div class="day-item" data-day="5">SEX</div><div class="day-item" data-day="6">SAB</div>
                <div class="day-item" data-day="0">DOM</div>
            </div>
            <label>Nome Completo</label><input type="text" id="cfg-nome">
            <label>RG</label><input type="text" id="cfg-rg">
            <label>Empresa</label><input type="text" id="cfg-empresa">
            <label>Valor Diária (R$)</label><input type="number" id="cfg-diaria" step="0.01">
            <label>Horários Carga Horária</label>
            <div class="grid-2">
                <input type="time" id="cfg-h1"> <input type="time" id="cfg-h2">
                <input type="time" id="cfg-h3"> <input type="time" id="cfg-h4">
            </div>
            <button class="btn btn-gold" style="margin-top:20px" onclick="salvarConfig()">Salvar e Fechar</button>
            <button class="btn btn-outline" onclick="fecharModais()">Sair</button>
        </div>
    </div>

    <!-- MODAL RETROATIVO -->
    <div id="modal-retro" class="modal">
        <div class="modal-content">
            <h2 style="color: #5af; margin: 0;">Lançamento Manual</h2>
            <label>Data</label><input type="date" id="retro-data">
            <div class="grid-2">
                <div><label>Entrada</label><input type="time" id="retro-h1"></div>
                <div><label>Alm. Saída</label><input type="time" id="retro-h2"></div>
                <div><label>Alm. Volta</label><input type="time" id="retro-h3"></div>
                <div><label>Saída</label><input type="time" id="retro-h4"></div>
            </div>
            <label>Senha Master</label><input type="password" id="retro-pass">
            <button class="btn btn-gold" style="margin-top:20px" onclick="salvarRetro()">Gravar Dia</button>
            <button class="btn btn-outline" onclick="fecharModais()">Sair</button>
        </div>
    </div>

    <!-- MODAL VALE -->
    <div id="modal-vale" class="modal">
        <div class="modal-content">
            <h2 style="color: var(--gold); margin: 0;">Lançar Vale</h2>
            <label>Valor (R$)</label><input type="number" id="vale-valor" placeholder="0.00">
            <label>Data</label><input type="date" id="vale-data">
            <button class="btn btn-gold" style="margin-top:20px" onclick="salvarVale()">Salvar Vale</button>
            <button class="btn btn-outline" onclick="fecharModais()">Sair</button>
        </div>
    </div>

    <script>
        const KEY_REGS = "ELITE_REGS_V15";
        const KEY_CFG = "ELITE_CFG_V15";
        const KEY_VALES = "ELITE_VALES_V15";

        // Registrar Service Worker para GitHub Pages
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js').then(() => console.log("SW OK"));
        }

        // Relógio
        setInterval(() => {
            document.getElementById('clock').innerText = new Date().toLocaleTimeString('pt-BR');
        }, 1000);

        function getDB(k) { return JSON.parse(localStorage.getItem(k) || "[]"); }
        function setDB(k, v) { localStorage.setItem(k, JSON.stringify(v)); }

        function abrirModal(id) {
            document.getElementById(id).style.display = 'block';
            if(id === 'modal-config') carregarConfigNaTela();
        }

        function fecharModais() { document.querySelectorAll('.modal').forEach(m => m.style.display='none'); }

        function carregarConfigNaTela() {
            const cfg = JSON.parse(localStorage.getItem(KEY_CFG) || "{}");
            document.getElementById('cfg-nome').value = cfg.nome || "";
            document.getElementById('cfg-rg').value = cfg.rg || "";
            document.getElementById('cfg-empresa').value = cfg.empresa || "";
            document.getElementById('cfg-diaria').value = cfg.diaria || "";
            document.getElementById('cfg-h1').value = cfg.h1 || "";
            document.getElementById('cfg-h2').value = cfg.h2 || "";
            document.getElementById('cfg-h3').value = cfg.h3 || "";
            document.getElementById('cfg-h4').value = cfg.h4 || "";
            document.querySelectorAll('.day-item').forEach(el => {
                el.classList.toggle('active', (cfg.dias || []).includes(parseInt(el.dataset.day)));
            });
        }

        function salvarConfig() {
            const dias = [];
            document.querySelectorAll('.day-item.active').forEach(el => dias.push(parseInt(el.dataset.day)));
            const cfg = {
                nome: document.getElementById('cfg-nome').value,
                rg: document.getElementById('cfg-rg').value,
                empresa: document.getElementById('cfg-empresa').value,
                diaria: parseFloat(document.getElementById('cfg-diaria').value || 0),
                h1: document.getElementById('cfg-h1').value, h2: document.getElementById('cfg-h2').value,
                h3: document.getElementById('cfg-h3').value, h4: document.getElementById('cfg-h4').value,
                dias: dias
            };
            localStorage.setItem(KEY_CFG, JSON.stringify(cfg));
            alert("Configurações Salvas!");
            fecharModais();
            atualizarStatus();
        }

        function registrarPonto() {
            const r = getDB(KEY_REGS);
            const agora = new Date();
            r.push({ 
                data: agora.toLocaleDateString('sv-SE'), 
                hora: agora.toLocaleTimeString('pt-BR', {hour:'2-digit', minute:'2-digit'}),
                ts: agora.getTime() 
            });
            setDB(KEY_REGS, r);
            alert("Ponto Batido!");
            atualizarStatus();
        }

        function salvarRetro() {
            if(document.getElementById('retro-pass').value !== "1801") return alert("Senha Inválida");
            const d = document.getElementById('retro-data').value;
            const h = [
                document.getElementById('retro-h1').value, document.getElementById('retro-h2').value,
                document.getElementById('retro-h3').value, document.getElementById('retro-h4').value
            ];
            const r = getDB(KEY_REGS);
            h.forEach(hora => { if(hora) r.push({ data: d, hora: hora, ts: new Date(d + "T" + hora).getTime() }); });
            setDB(KEY_REGS, r);
            alert("Dia Salvo!");
            fecharModais();
        }

        function salvarVale() {
            const v = parseFloat(document.getElementById('vale-valor').value || 0);
            const d = document.getElementById('vale-data').value;
            if(!v || !d) return alert("Dados incompletos");
            const vales = getDB(KEY_VALES);
            vales.push({ valor: v, data: d });
            setDB(KEY_VALES, vales);
            alert("Vale Salvo!");
            fecharModais();
        }

        function limparDados() {
            if(confirm("Apagar tudo permanentemente?")) {
                localStorage.clear();
                location.reload();
            }
        }

        function toMin(h) { if(!h || h === "-") return 0; const [hrs, min] = h.split(':').map(Number); return (hrs * 60) + min; }

        async function gerarPDF() {
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();
            const cfg = JSON.parse(localStorage.getItem(KEY_CFG) || "{}");
            const regs = getDB(KEY_REGS);
            const vales = getDB(KEY_VALES);

            doc.setFontSize(16); doc.text("EXTRATO FINANCEIRO ELITE PRO", 105, 15, {align:'center'});
            doc.setFontSize(10);
            doc.text(`Colaborador: ${cfg.nome || '---'} | RG: ${cfg.rg || '---'}`, 14, 25);
            doc.text(`Empresa: ${cfg.empresa || '---'} | Diária: R$ ${Number(cfg.diaria || 0).toFixed(2)}`, 14, 30);

            const diasAg = {};
            regs.sort((a,b)=>a.ts-b.ts).forEach(r => {
                if(!diasAg[r.data]) diasAg[r.data] = [];
                if(diasAg[r.data].length < 4) diasAg[r.data].push(r.hora);
            });

            const cargaMinutos = (toMin(cfg.h2) - toMin(cfg.h1)) + (toMin(cfg.h4) - toMin(cfg.h3));
            let totalExtrasMin = 0;
            const rowsPonto = Object.keys(diasAg).map(d => {
                const p = diasAg[d];
                let trab = 0;
                if(p[1] && p[0]) trab += (toMin(p[1]) - toMin(p[0]));
                if(p[3] && p[2]) trab += (toMin(p[3]) - toMin(p[2]));
                let ex = (cargaMinutos > 0 && trab > cargaMinutos) ? trab - cargaMinutos : 0;
                totalExtrasMin += ex;
                return [d.split('-').reverse().join('/'), p[0]||'-', p[1]||'-', p[2]||'-', p[3]||'-', (ex/60).toFixed(2)+'h'];
            });

            doc.autoTable({ startY: 35, head: [['Data', 'Ent.', 'Alm.S', 'Alm.V', 'Saí.', 'Extra']], body: rowsPonto });

            let totalVales = 0;
            const rowsVales = vales.map(v => { totalVales += v.valor; return [v.data.split('-').reverse().join('/'), `R$ ${v.valor.toFixed(2)}`]; });
            doc.autoTable({ startY: doc.lastAutoTable.finalY + 10, head: [['Data Vale', 'Valor']], body: rowsVales });

            const valorDiarias = Object.keys(diasAg).length * (cfg.diaria || 0);
            const valorExtras = ((cfg.diaria || 0) / 8) * (totalExtrasMin / 60);
            const saldo = (valorDiarias + valorExtras) - totalVales;

            const fY = doc.lastAutoTable.finalY + 15;
            doc.text(`(+) Salário (${Object.keys(diasAg).length} dias): R$ ${valorDiarias.toFixed(2)}`, 14, fY);
            doc.text(`(+) Horas Extras: R$ ${valorExtras.toFixed(2)}`, 14, fY + 7);
            doc.text(`(-) Total Vales: R$ ${totalVales.toFixed(2)}`, 14, fY + 14);
            doc.setFont(undefined, 'bold');
            doc.text(`SALDO LÍQUIDO A RECEBER: R$ ${saldo.toFixed(2)}`, 14, fY + 24);

            doc.save(`Ponto_${cfg.nome || 'Elite'}.pdf`);
        }

        function atualizarStatus() {
            const regs = getDB(KEY_REGS);
            const hoje = new Date().toLocaleDateString('sv-SE');
            const batidas = regs.filter(r => r.data === hoje).length;
            const dot = document.getElementById('status-dot');
            const txt = document.getElementById('status-text');
            if(batidas === 0) { s("#ff3b30", "Aguardando Entrada"); }
            else if(batidas % 2 !== 0) { s("#4cd964", "Em Serviço"); }
            else { s("#ff9500", "Pausa/Intervalo"); }
            function s(c, t) { dot.style.backgroundColor = c; txt.style.color = c; txt.innerText = t; }
        }

        document.querySelectorAll('.day-item').forEach(el => el.onclick = () => el.classList.toggle('active'));
        window.onload = atualizarStatus;
    </script>
</body>
</html>
