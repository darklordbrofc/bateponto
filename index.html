<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#D4AF37">
    <link rel="manifest" href="manifest.json">
    <title>Ponto Elite Pro V18 - Gold</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.25/jspdf.plugin.autotable.min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Poppins:wght@300;400;600&display=swap');
        :root { --gold: #D4AF37; --gold-grad: linear-gradient(135deg, #f9e498 0%, #D4AF37 50%, #b8860b 100%); --bg: #050505; }
        body { font-family: 'Poppins', sans-serif; background-color: var(--bg); color: #fff; margin: 0; display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding-bottom: 50px; }
        .status-bar { width: 100%; padding: 12px 0; display: flex; justify-content: center; align-items: center; gap: 10px; background: #000; border-bottom: 1px solid #222; font-size: 11px; font-weight: 700; }
        .dot { width: 10px; height: 10px; border-radius: 50%; box-shadow: 0 0 10px currentColor; }
        .header h1 { font-family: 'Orbitron', sans-serif; background: var(--gold-grad); -webkit-background-clip: text; -webkit-text-fill-color: transparent; font-size: 24px; margin: 20px 0; }
        .clock-box { text-align: center; margin-bottom: 20px; padding: 15px 40px; background: rgba(212, 175, 55, 0.1); border-radius: 50px; border: 1px solid var(--gold); }
        #clock { font-family: 'Orbitron', sans-serif; font-size: 32px; color: var(--gold); }
        .main-container { width: 92%; max-width: 400px; background: #111; padding: 25px; border-radius: 28px; border: 1px solid #222; box-shadow: 0 20px 40px rgba(0,0,0,0.5); box-sizing: border-box; }
        .btn { width: 100%; padding: 18px; margin: 8px 0; border: none; border-radius: 16px; font-weight: 700; text-transform: uppercase; cursor: pointer; font-size: 12px; display: flex; align-items: center; justify-content: center; color: #fff; }
        .btn-gold { background: var(--gold-grad); color: #000; }
        .btn-outline { background: transparent; border: 1px solid #333; color: #aaa; }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); z-index: 1000; overflow-y: auto; padding-top: 20px; }
        .modal-content { background: #0f0f0f; width: 90%; max-width: 400px; margin: auto; padding: 25px; border-radius: 24px; border: 1px solid #333; box-sizing: border-box; }
        label { color: var(--gold); font-size: 10px; font-weight: 700; display: block; margin-top: 15px; }
        input { width: 100%; padding: 14px; margin-top: 5px; background: #1a1a1a; border: 1px solid #333; border-radius: 10px; color: #fff; box-sizing: border-box; font-size: 16px; }
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .day-item { font-size: 10px; padding: 10px; background: #1a1a1a; border: 1px solid #333; border-radius: 8px; text-align: center; cursor: pointer; }
        .day-item.active { background: var(--gold-grad); color: #000; font-weight: bold; }
        #btn-main-ponto { transition: 0.3s; }
    </style>
</head>
<body>

    <div class="status-bar">
        <div class="dot" id="status-dot"></div>
        <span id="status-text">...</span>
    </div>

    <div class="header"><h1>PONTO ELITE PRO</h1></div>

    <div class="clock-box"><div id="clock">00:00:00</div></div>

    <div class="main-container">
        <button class="btn btn-gold" id="btn-main-ponto" onclick="registrarPonto()">Carregando...</button>
        <button class="btn btn-outline" style="color:#5af" onclick="abrirModal('modal-retro')">✎ Lançamento Retroativo</button>
        <button class="btn btn-outline" onclick="abrirModal('modal-vale')">💰 Registrar Vale</button>
        <div class="grid-2">
            <button class="btn btn-outline" onclick="gerarPDF()">📄 Gerar PDF Completo</button>
            <button class="btn btn-outline" onclick="abrirModal('modal-config')">⚙ Ajustes</button>
        </div>
        <button class="btn btn-outline" style="color: #ff3b30; border-color: #400; margin-top:15px" onclick="limparTudo()">🗑 Zerar Sistema</button>
    </div>

    <!-- MODAL AJUSTES -->
    <div id="modal-config" class="modal">
        <div class="modal-content">
            <h2 style="color: var(--gold);">Configurações</h2>
            <label>Dias de Trabalho</label>
            <div class="grid-2" style="grid-template-columns: repeat(4, 1fr);">
                <div class="day-item" data-day="1">SEG</div><div class="day-item" data-day="2">TER</div>
                <div class="day-item" data-day="3">QUA</div><div class="day-item" data-day="4">QUI</div>
                <div class="day-item" data-day="5">SEX</div><div class="day-item" data-day="6">SAB</div>
                <div class="day-item" data-day="0">DOM</div>
            </div>
            <label>Nome Completo</label><input type="text" id="cfg-nome">
            <label>WhatsApp (55...)</label><input type="number" id="cfg-zap">
            <label>Valor Diária (R$)</label><input type="number" id="cfg-diaria">
            <label>Horários Oficiais (Entrada | Almoço | Volta | Saída)</label>
            <div class="grid-2">
                <input type="time" id="cfg-h1"> <input type="time" id="cfg-h2">
                <input type="time" id="cfg-h3"> <input type="time" id="cfg-h4">
            </div>
            <button class="btn btn-gold" style="margin-top:20px" onclick="salvarConfig()">Salvar</button>
            <button class="btn btn-outline" onclick="fecharModais()">Sair</button>
        </div>
    </div>

    <!-- MODAL RETROATIVO -->
    <div id="modal-retro" class="modal">
        <div class="modal-content">
            <h2>Lançamento Manual</h2>
            <label>Data</label><input type="date" id="retro-data">
            <div class="grid-2">
                <input type="time" id="retro-h1"> <input type="time" id="retro-h2">
                <input type="time" id="retro-h3"> <input type="time" id="retro-h4">
            </div>
            <label>Senha Master</label><input type="password" id="retro-pass" placeholder="1801">
            <button class="btn btn-gold" style="margin-top:15px" onclick="salvarRetro()">Gravar Dia</button>
            <button class="btn btn-outline" onclick="fecharModais()">Cancelar</button>
        </div>
    </div>

    <!-- MODAL VALE -->
    <div id="modal-vale" class="modal">
        <div class="modal-content">
            <h2>Registrar Vale</h2>
            <label>Valor R$</label><input type="number" id="vale-valor">
            <label>Data</label><input type="date" id="vale-data">
            <button class="btn btn-gold" style="margin-top:15px" onclick="salvarVale()">Salvar</button>
            <button class="btn btn-outline" onclick="fecharModais()">Cancelar</button>
        </div>
    </div>

    <div style="text-align: center; color: #333; font-size: 8px; margin-top: 15px;">Versão 18.0 - Fluxo Progressivo</div>

    <script>
        const KEY_REGS = "ELITE_REGS_V18"; 
        const KEY_CFG = "ELITE_CFG_V18"; 
        const KEY_VALES = "ELITE_VALES_V18";

        window.onload = () => {
            atualizarStatus();
            setInterval(() => document.getElementById('clock').innerText = new Date().toLocaleTimeString('pt-BR'), 1000);
            document.querySelectorAll('.day-item').forEach(el => el.onclick = () => el.classList.toggle('active'));
        };

        function abrirModal(id) {
            document.getElementById(id).style.display = 'block';
            const cfg = JSON.parse(localStorage.getItem(KEY_CFG) || "{}");
            if(id === 'modal-config') {
                document.getElementById('cfg-nome').value = cfg.nome || "";
                document.getElementById('cfg-zap').value = cfg.zap || "";
                document.getElementById('cfg-diaria').value = cfg.diaria || "";
                document.getElementById('cfg-h1').value = cfg.h1 || "";
                document.getElementById('cfg-h2').value = cfg.h2 || "";
                document.getElementById('cfg-h3').value = cfg.h3 || "";
                document.getElementById('cfg-h4').value = cfg.h4 || "";
                document.querySelectorAll('.day-item').forEach(el => el.classList.toggle('active', (cfg.dias || []).includes(parseInt(el.dataset.day))));
            }
            if(id === 'modal-retro') {
                document.getElementById('retro-h1').value = cfg.h1 || "";
                document.getElementById('retro-h2').value = cfg.h2 || "";
                document.getElementById('retro-h3').value = cfg.h3 || "";
                document.getElementById('retro-h4').value = cfg.h4 || "";
                document.getElementById('retro-data').value = new Date().toLocaleDateString('sv-SE');
            }
            if(id === 'modal-vale') document.getElementById('vale-data').value = new Date().toLocaleDateString('sv-SE');
        }

        function fecharModais() { document.querySelectorAll('.modal').forEach(m => m.style.display='none'); }

        function salvarConfig() {
            const dias = []; 
            document.querySelectorAll('.day-item.active').forEach(el => dias.push(parseInt(el.dataset.day)));
            const cfg = {
                nome: document.getElementById('cfg-nome').value, zap: document.getElementById('cfg-zap').value,
                diaria: parseFloat(document.getElementById('cfg-diaria').value || 0),
                h1: document.getElementById('cfg-h1').value, h2: document.getElementById('cfg-h2').value,
                h3: document.getElementById('cfg-h3').value, h4: document.getElementById('cfg-h4').value,
                dias: dias
            };
            localStorage.setItem(KEY_CFG, JSON.stringify(cfg));
            alert("Ajustes Salvos!"); fecharModais(); atualizarStatus();
        }

        function registrarPonto() {
            const cfg = JSON.parse(localStorage.getItem(KEY_CFG) || "{}");
            let r = JSON.parse(localStorage.getItem(KEY_REGS) || "[]");
            const agora = new Date();
            const hoje = agora.toLocaleDateString('sv-SE');
            const batidasHoje = r.filter(x => x.data === hoje).length;

            // Trava de Segurança para Encerramento (4ª batida)
            if (batidasHoje === 3) {
                const horaSaidaCfg = cfg.h4 || "17:00";
                const [hCfg, mCfg] = horaSaidaCfg.split(':').map(Number);
                const limite = new Date(); limite.setHours(hCfg, mCfg, 0);

                if (agora < limite) {
                    if (!confirm("Ainda não chegou o horário de término oficial. Deseja encerrar as atividades agora?")) return;
                } else {
                    if (!confirm("Confirmar encerramento das atividades de hoje?")) return;
                }
            }

            if (batidasHoje >= 4) {
                if (!confirm("Você já completou as 4 batidas de hoje. Deseja registrar uma batida extra?")) return;
            }

            const novo = { 
                data: hoje, 
                hora: agora.toLocaleTimeString('pt-BR', {hour:'2-digit', minute:'2-digit'}), 
                ts: agora.getTime() 
            };

            r.push(novo);
            localStorage.setItem(KEY_REGS, JSON.stringify(r));
            
            enviarZap(novo.hora, batidasHoje);
            atualizarStatus();
        }

        function atualizarStatus() {
            const regs = JSON.parse(localStorage.getItem(KEY_REGS) || "[]");
            const hoje = new Date().toLocaleDateString('sv-SE');
            const batidas = regs.filter(r => r.data === hoje).length;
            const dot = document.getElementById('status-dot'), 
                  txt = document.getElementById('status-text'),
                  btn = document.getElementById('btn-main-ponto');

            const estados = [
                { t: "Iniciar Serviço", s: "Aguardando Início", c: "#ff3b30" },
                { t: "Sair para Almoço", s: "Em Serviço", c: "#4cd964" },
                { t: "Retornar do Almoço", s: "Em Pausa (Almoço)", c: "#ff9500" },
                { t: "Encerrar Atividades", s: "Em Serviço (Pós-Almoço)", c: "#4cd964" },
                { t: "Bater Extra", s: "Jornada Encerrada", c: "#5af" }
            ];

            const atual = estados[batidas] || estados[4];
            btn.innerText = atual.t;
            txt.innerText = atual.s;
            txt.style.color = atual.c;
            dot.style.backgroundColor = atual.c;
        }

        function salvarRetro() {
            if(document.getElementById('retro-pass').value !== "1801") return alert("Senha Incorreta!");
            const data = document.getElementById('retro-data').value;
            if(!data) return alert("Escolha a data!");
            let r = JSON.parse(localStorage.getItem(KEY_REGS) || "[]");
            const h1 = document.getElementById('retro-h1').value;
            const h2 = document.getElementById('retro-h2').value;
            const h3 = document.getElementById('retro-h3').value;
            const h4 = document.getElementById('retro-h4').value;

            [h1, h2, h3, h4].forEach(h => {
                if(h) r.push({ data: data, hora: h, ts: new Date(data + "T" + h).getTime() });
            });
            localStorage.setItem(KEY_REGS, JSON.stringify(r));
            alert("Dia Gravado!"); fecharModais(); atualizarStatus();
        }

        function salvarVale() {
            const v = document.getElementById('vale-valor').value, d = document.getElementById('vale-data').value;
            if(!v || !d) return alert("Faltam dados!");
            let vales = JSON.parse(localStorage.getItem(KEY_VALES) || "[]");
            vales.push({ valor: parseFloat(v), data: d });
            localStorage.setItem(KEY_VALES, JSON.stringify(vales));
            alert("Vale Salvo!"); fecharModais();
        }

        function toMin(h) { if(!h || h === "-" || h === "") return 0; const parts = h.split(':'); return (parseInt(parts[0]) * 60) + parseInt(parts[1]); }

        async function gerarPDF() {
            const { jsPDF } = window.jspdf; const doc = new jsPDF();
            const cfg = JSON.parse(localStorage.getItem(KEY_CFG) || "{}");
            const regs = JSON.parse(localStorage.getItem(KEY_REGS) || "[]");
            const vales = JSON.parse(localStorage.getItem(KEY_VALES) || "[]");

            doc.setFontSize(16); doc.text("FOLHA DE PAGAMENTO ELITE PRO", 105, 15, {align:'center'});
            doc.setFontSize(10); doc.text(`Nome: ${cfg.nome || '---'} | Diária: R$ ${Number(cfg.diaria||0).toFixed(2)}`, 14, 25);

            const diasAg = {};
            regs.forEach(r => { if(!diasAg[r.data]) diasAg[r.data] = []; diasAg[r.data].push(r.hora); });

            const cargaPadraoMin = (toMin(cfg.h2)-toMin(cfg.h1)) + (toMin(cfg.h4)-toMin(cfg.h3));
            let totalExtrasMin = 0;

            const rows = Object.keys(diasAg).sort().map(d => {
                const p = diasAg[d].sort();
                const h1 = p[0]||"-", h2 = p[1]||"-", h3 = p[2]||"-", h4 = p[3]||"-";
                const trabalhado = (toMin(h2)-toMin(h1)) + (toMin(h4)-toMin(h3));
                
                const diaSemana = new Date(d + "T12:00:00").getDay(); 
                const eDiaTrabalho = (cfg.dias || []).includes(diaSemana);

                let extra = 0;
                if (!eDiaTrabalho) extra = trabalhado;
                else extra = (trabalhado > cargaPadraoMin) ? trabalhado - cargaPadraoMin : 0;
                
                totalExtrasMin += extra;
                return [d.split('-').reverse().join('/'), h1, h2, h3, h4, (extra/60).toFixed(2)+'h'];
            });

            doc.autoTable({ startY: 35, head: [['Data', 'Início', 'Almoço S.', 'Almoço V.', 'Encerra.', 'Extra']], body: rows, headStyles: { fillColor: [212, 175, 55] } });

            let totalVales = 0;
            const vRows = vales.sort((a,b)=>a.data.localeCompare(b.data)).map(v => { totalVales += v.valor; return [v.data.split('-').reverse().join('/'), `R$ ${v.valor.toFixed(2)}`]; });
            if(vRows.length > 0) doc.autoTable({ startY: doc.lastAutoTable.finalY + 10, head: [['Data Vale', 'Valor']], body: vRows, headStyles: { fillColor: [180, 0, 0] } });

            const valorDiarias = Object.keys(diasAg).length * (cfg.diaria || 0);
            const valorExtras = ((cfg.diaria || 0) / 8) * (totalExtrasMin / 60);
            const liquido = (valorDiarias + valorExtras) - totalVales;

            const fY = doc.lastAutoTable.finalY + 15;
            doc.setFont(undefined, 'bold'); doc.text(`RESUMO FINANCEIRO:`, 14, fY);
            doc.setFont(undefined, 'normal');
            doc.text(`(+) Salário Base: R$ ${valorDiarias.toFixed(2)}`, 14, fY+7);
            doc.text(`(+) Total Horas Extras: R$ ${valorExtras.toFixed(2)}`, 14, fY+14);
            doc.text(`(-) Total Vales: R$ ${totalVales.toFixed(2)}`, 14, fY+21);
            doc.setFontSize(12); doc.text(`LÍQUIDO A RECEBER: R$ ${liquido.toFixed(2)}`, 14, fY+30);

            doc.save(`Folha_${cfg.nome}.pdf`);
        }

        function enviarZap(hora, batidaIdx) {
            const cfg = JSON.parse(localStorage.getItem(KEY_CFG) || "{}");
            if(!cfg.zap) return;
            const tipos = ["INÍCIO", "ALMOÇO (SAÍDA)", "ALMOÇO (RETORNO)", "ENCERRAMENTO"];
            const tipo = tipos[batidaIdx] || "EXTRA";
            const msg = window.encodeURIComponent(`*PONTO ELITE PRO*\n📌 *Status:* ${tipo}\n⏰ *Hora:* ${hora}\n📅 *Data:* ${new Date().toLocaleDateString('pt-BR')}`);
            window.open(`https://wa.me/${cfg.zap}?text=${msg}`);
        }

        function limparTudo() { if(confirm("Deseja apagar TODOS os registros? Isso não tem volta.")) { localStorage.clear(); location.reload(); } }
    </script>
</body>
</html>
